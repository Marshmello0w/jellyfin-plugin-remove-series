name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.RemoveSeries.slnx
      - name: Build
        run: dotnet build Jellyfin.Plugin.RemoveSeries.slnx --configuration Release --no-restore
      - name: Server tests
        run: dotnet test Jellyfin.Plugin.RemoveSeries.slnx --configuration Release --no-build
      - name: Web tests
        run: npm test
      - name: Validate Jellyfin plugin catalog
        shell: pwsh
        run: |
          $document = [System.Text.Json.JsonDocument]::Parse((Get-Content manifest.json -Raw))
          if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Array) {
            throw "manifest.json must contain a JSON array."
          }
          if ($document.RootElement.GetArrayLength() -eq 0) {
            throw "manifest.json must contain at least one plugin."
          }
